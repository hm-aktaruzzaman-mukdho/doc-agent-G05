# THE place you set models & parameters. Code reads only from here.
seed: 42
device: cuda

ingest:
  raw_dir: "data/raw"
  allow_empty: true
  extensions: [".png", ".jpg", ".jpeg", ".tif", ".tiff", ".webp"]
preprocess:
  enabled: true
  output_dir: "data/interim/preprocessed"
  deskew: true
  denoise: true
  denoise_strength: 7
  binarize: true
  threshold_block_size: 31
  threshold_constant: 15
enhance: {enabled: false, model: "none", type: "none"}
layout:
  model: "opencv:morphology"
  table_min_area_fraction: 0.02
  text_min_area_fraction: 0.00015
  text_min_width: 30
  text_min_height: 8
  merge_threshold: 0.3
ocr:
  model: "easyocr:bn"
  languages: ["bn"]
  gpu: true
  require_gpu: true
  batch_size: 8
  low_confidence_threshold: 0.70
  structural_refiner: "Qwen/Qwen3.5-4B"
  source_script: "../../dl-ocr-parallel.py"
  use_precomputed: true
  precomputed_markdown:
    history: "../../ocr_output/Secondary (BV)-2026_Class 9-10_History_compressed.md"
    bhugol: "../../Secondary (BV)-2026_Class 9-10_Bhugol_compressed_dual_gpu.md"
embed:
  model: "BAAI/bge-m3"
  dim: 1024
  batch_size: 16
  normalize: true
  show_progress: true
index:
  type: "faiss:flat-ip"
  path: "../../rag_index"
  chunker: "chonkie.TokenChunker"
  chunk_tokens: 384
  overlap: 64
retrieve:
  k: 5
  candidate_k: 24
  hybrid: true
  k_step: 5
  k_max: 20
  weak_threshold: 0.35
  rerank: true
  reranker: "BAAI/bge-reranker-v2-m3"
  reranker_max_length: 512
  batch_size: 16
agent:     {max_steps: 8, autonomy: "act-with-approval", budget_usd: 0.05}
rl:        {algo: "ppo", train_policy: false}                         # bonus: set true
serve:     {batch: true}
deploy:    {target: "hf-spaces"}
